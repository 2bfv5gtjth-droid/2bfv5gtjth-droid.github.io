/* ---------- winkel ---------- */
function findItem(kind,id){
  const list=kind==='theme'?THEMES:(kind==='conf'?CONFETTI:EXTRAS);
  return list.find(x=>x.id===id);
}
function clearPreview(){
  if(!S.preview)return;
  S.preview=null;applyThemeStyle();
}
function buyItem(kind,id){
  const it=findItem(kind,id);
  if(!it)return;
  if(kind!=='extra'&&S.owned.indexOf(kind+':'+id)>=0)return;
  if(balance()<it.price){
    toast('Nog '+(it.price-balance())+' punten nodig voor '+it.name+'.');haptic([30,40]);
    return;
  }
  S.spent+=it.price;
  S.stats.shopped=(S.stats.shopped||0)+1;
  if(kind==='extra'){
    if(id==='boost')S.boostUntil=Math.max(Date.now(),S.boostUntil||0)+86400000;
    else S.shields=(S.shields||0)+1;
  }else{
    S.owned.push(kind+':'+id);
    if(kind==='theme'){S.themeId=id;S.preview=null;applyThemeStyle();}
    else S.confettiId=id;
  }
  save();renderShop();confetti();haptic([20,30,20]);
  toast('Gekocht: '+it.emoji+' '+it.name);
  checkBadges();
}
function equipItem(kind,id){
  const it=findItem(kind,id);
  if(!it)return;
  const owned=S.owned.indexOf(kind+':'+id)>=0;
  if(!owned){
    if(kind==='theme'&&it.locked&&themeUnlocked(it))S.owned.push(kind+':'+id);
    else return;
  }
  if(kind==='theme'){S.themeId=id;S.preview=null;applyThemeStyle();}
  else S.confettiId=id;
  save();renderShop();
  toast(it.emoji+' '+it.name+' is nu actief');
  if(kind==='conf')confetti();
}
function previewTheme(id){
  const th=findItem('theme',id);
  if(!th)return;
  S.preview=id;applyThemeStyle();
  toast('Voorbeeld: '+th.emoji+' '+th.name,'Terug',function(){clearPreview();});
  setTimeout(function(){if(S.preview===id)clearPreview();},9000);
}
function useShield(key){
  if((S.shields||0)<1||S.shielded[key])return;
  S.shields--;S.shielded[key]=true;
  save();renderAll();
  toast('🛡️ Reeksschild gebruikt. Je reeks is veilig.');
}
function shieldBtn(all){
  if(!(S.shields>0)||S.sel>=todayKey()||S.shielded[S.sel]||!all.some(t=>!t.done))return '';
  return '<div style="text-align:center"><button class="linkbtn" type="button" data-act="useshield" data-key="'+S.sel+'">🛡️ Reeksschild gebruiken ('+S.shields+')</button></div>';
}
function lockLabel(th){
  if(th.unlock==='legende')return 'Bereik het hoogste totaalniveau (Legende)';
  const b=BADGES.find(x=>x.id===th.unlock);
  return b?'Haal de prestatie: '+b.emoji+' '+b.name:'Nog te ontgrendelen';
}
function buyBtn(kind,it,bal){
  const aff=bal>=it.price;
  return '<button class="btn wide'+(aff?' primary':' locked')+'" type="button" data-act="buy" data-k="'+kind+'" data-id="'+it.id+'">'+(aff?'Koop ⭐ '+it.price:'🔒 ⭐ '+it.price)+'</button>';

        +action
        +(th.locked&&(unlocked||owned)?'<button class="linkbtn" type="button" data-act="preview" data-id="'+th.id+'" style="padding:2px;text-decoration:none">👀 Voorbeeld</button>':'')

/* ---------- sheets ---------- */
let CUR=null,FM=null,TS=null;
function openSheetWith(fn){
  $('#toast').classList.remove('show');
  CUR=fn;fn();
  const sh=$('#sheet');
  sh.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add('open');});});
}
function redraw(focusId){
  if(!CUR)return;
  const p=$('#sheet .panel'),st=p?p.scrollTop:0;
  CUR(focusId);
  const q=$('#sheet .panel');
  if(q)q.scrollTop=st;
}
function closeSheet(){
  const sh=$('#sheet');
  sh.classList.remove('open');
  CUR=null;FM=null;TS=null;
  setTimeout(function(){if(!CUR){sh.hidden=true;sh.innerHTML='';}},260);
}
function timeField(T){
  const chips=['07:00','08:00','12:00','17:00','18:00','20:00'];
  return '<div class="fld"><span>Vaste tijd <small style="font-weight:600;color:var(--muted)">komt in je agenda</small></span>'
    +'<div class="row2" style="align-items:center;margin-bottom:8px"><input class="inp" type="time" id="t-at" step="300" value="'+esc(T.at||'')+'" style="flex:1"><button type="button" class="btn" data-act="tatclear">Wissen</button></div>'
    +'<div class="opts">'+chips.map(c=>'<button type="button" class="opt'+(T.at===c?' on':'')+'" data-act="tat" data-t="'+c+'">'+c+'</button>').join('')+'</div></div>';
}
function weightSection(w,tid,min,act){
  const eff=w||defaultW({tid:tid,min:min});
  const pts=Math.max(5,Math.round(min*eff/5)*5);
  return '<div class="fld"><span>Zwaarte <small style="font-weight:600;color:var(--muted)">→ ⭐ '+pts+' punten</small></span><div class="opts">'
    +WEIGHTS.map(x=>'<button type="button" class="opt'+(eff===x[0]?' on':'')+'" data-act="'+act+'" data-w="'+x[0]+'">'+x[1]+' '+x[2]+'</button>').join('')+'</div></div>';
}
function minChips(cur){
  return [5,10,15,20,30,45,60,90].map(m=>'<button type="button" class="opt'+(cur===m?' on':'')+'" data-act="'+(TS?'tmin':'fmin')+'" data-m="'+m+'">'+fmtMin(m)+'</button>').join('');
}

/* taak plannen / aanpassen */
function openTaskSheet(o){
  if(o.mode==='add'){
    const t=taskById(o.tid);
    if(!t)return;
    TS={mode:'add',tid:t.id,name:t.name,emoji:t.emoji,cat:t.cat,min:t.min,w:t.w||null,at:null,days:[S.sel],time:DEF[t.id]||'any',who:S.addWho||null,note:'',repeat:false,hadRule:false,err:''};
  }else{
    const it=(S.plan[o.key]||[]).find(x=>x.id===o.id);
    if(!it)return;
    const rule=it.rid?S.repeats.find(r=>r.id===it.rid):null;
    TS={mode:'edit',key:o.key,id:it.id,tid:it.tid,name:it.name,emoji:it.emoji,cat:it.cat,min:it.min,w:it.w||null,at:it.at||null,days:[o.key],time:it.time||'any',who:it.who||null,note:it.note||'',repeat:!!rule,hadRule:!!rule,err:''};
  }
  openSheetWith(renderTaskSheet);
}

  +timeField(T)
  +who
  +'<div class="fld"><span>Benodigde tijd</span><div class="opts">'+minChips(T.min)+'</div></div>'
  +weightSection(T.w,T.tid,T.min,'tw')
  +'<label class="fld"><span>Notitie</span><input class="inp" id="t-note" type="text" maxlength="80" placeholder="Optioneel" autocomplete="off" value="'+esc(T.note)+'"></label>'
  +'<button type="button" class="toggle" role="switch" aria-checked="'+T.repeat+'" data-act="trep"><span>Elke week herhalen'+(multi&&T.days.length>1?' op deze dagen':'')+'</span><i class="knob"></i></button>'
  +(T.hadRule?'<p class="help">Zet dit uit om vanaf deze dag te stoppen met herhalen.</p>':'')
  +(multi?'':'<button type="button" class="btn wide" data-act="timerstart" style="margin-bottom:12px">⏱️ Timer starten ('+fmtMin(T.min)+')</button>')
  +(T.err?'<p class="err">'+esc(T.err)+'</p>':'')
  +'<div class="actions">'
  +(multi?'<button type="button" class="btn ghost" data-act="closesheet">Annuleren</button><button type="button" class="btn primary" data-act="tsave">Toevoegen aan '+T.days.length+(T.days.length===1?' dag':' dagen')+'</button>'
         :'<button type="button" class="btn danger" data-act="tdelete">Verwijderen</button><button type="button" class="btn primary" data-act="tsave">Opslaan</button>')
  +'</div></div>';
  if(focusId){const i=$('#'+focusId);if(i)i.focus();}

function saveTaskSheet(){
  const T=TS;
  if(T.mode==='add'){
    if(!T.days.length){T.err='Kies minstens één dag.';redraw();return;}
    const note=T.note.trim();
    T.days.slice().sort().forEach(function(k){
      const item={id:uid(),tid:T.tid,name:T.name,emoji:T.emoji,cat:T.cat,min:T.min,w:T.w||null,at:T.at||null,time:T.time,who:T.who,note:note,done:false};
      if(T.repeat){
        const r=makeRule({tid:T.tid,name:T.name,emoji:T.emoji,cat:T.cat,min:T.min,w:T.w,at:T.at,time:T.time,who:T.who,note:note},wdOf(k),k);
        S.repeats.push(r);item.rid=r.id;
      }
      (S.plan[k]=S.plan[k]||[]).push(item);
    });
    const n=T.days.length,rep=T.repeat;
    save();closeSheet();renderAll();
    toast('Toegevoegd aan '+n+(n===1?' dag':' dagen')+(rep?', herhaalt wekelijks':''));
    return;
  }
  const arr=S.plan[T.key]||[];
  const it=arr.find(x=>x.id===T.id);
  if(!it){closeSheet();return;}
  const name=T.name.trim();
  if(!name){T.err='Geef de taak een naam.';redraw('t-name');return;}
  it.name=name;it.min=T.min;it.w=T.w||null;it.at=T.at||null;it.time=T.time;it.who=T.who;it.note=T.note.trim();
  let rule=it.rid?S.repeats.find(r=>r.id===it.rid):null;
  if(rule&&!T.repeat){
    delete it.rid;dropRule(rule.id,T.key);rule=null;
  }else if(rule){
    rule.name=name;rule.min=T.min;rule.w=T.w||null;rule.at=T.at||null;rule.time=T.time;rule.who=T.who;rule.note=it.note;
  }
  const newKey=T.days[0]||T.key;
  let fk=T.key;
  if(newKey!==T.key){
    if(it.rid){
      const cr=S.repeats.find(r=>r.id===it.rid);
      if(cr){cr.skip=cr.skip||[];cr.skip.push(T.key);}
      delete it.rid;
    }
    const src=S.plan[T.key]||[];
    const idx=src.indexOf(it);
    if(idx>=0)src.splice(idx,1);
    (S.plan[newKey]=S.plan[newKey]||[]).push(it);
    fk=newKey;
  }
  if(!rule&&!T.hadRule&&T.repeat){
    const r=makeRule({tid:it.tid,name:it.name,emoji:it.emoji,cat:it.cat,min:it.min,w:it.w,at:it.at,time:it.time,who:it.who,note:it.note},wdOf(fk),fk);
    S.repeats.push(r);it.rid=r.id;
  }
  save();closeSheet();renderAll();
  toast(newKey!==T.key?'Verplaatst naar '+dow(newKey):'Taak bijgewerkt');
}

function part(cls,x,y,z,w,h,extra,rz){
  h=(h!=null?h:w);
  return '<div class="p3-anchor" style="transform:translate3d('+px(x)+','+px(y)+','+px(z)+')">'
    +'<div class="p3-part '+cls+'" data-rz="'+(rz||0)+'" style="width:'+px(w)+';height:'+px(h)+';margin:'+px(-h/2)+' 0 0 '+px(-w/2)+(extra?';'+extra:'')+'"></div></div>';
}
function tri(cls,x,y,z,w,h,rz){
  return part(cls,x,y,z,w,h,null,rz);

  }
  return part('p3-eye-w',-gap,y,z,size)+part('p3-eye-b',-gap+size*0.16,y+size*0.05,z+1,size*0.5)
    +part('p3-eye-w',gap,y,z,size)+part('p3-eye-b',gap+size*0.16,y+size*0.05,z+1,size*0.5);

function bindPet3DDrag(){
  const vp=$('#p3-viewport');
  if(!vp||vp._bound)return;
  vp._bound=true;
  let dragging=false,sx=0,sy=0,rx=0,ry=0;
  function start(x,y){dragging=true;sx=x;sy=y;rx=S.pet3dRot.x;ry=S.pet3dRot.y;vp.classList.add('grab');}
  function move(x,y){
    if(!dragging)return;
    S.pet3dRot.y=ry+(x-sx)*0.5;
    S.pet3dRot.x=Math.max(-35,Math.min(35,rx-(y-sy)*0.4));
    applyPet3DRot();applyBillboards();
  }
  function end(){if(!dragging)return;dragging=false;vp.classList.remove('grab');save();}
  vp.addEventListener('pointerdown',function(e){start(e.clientX,e.clientY);try{vp.setPointerCapture(e.pointerId);}catch(_){}});
  vp.addEventListener('pointermove',function(e){move(e.clientX,e.clientY);});
  vp.addEventListener('pointerup',end);
  vp.addEventListener('pointercancel',end);
}

function playPetTransition(fromStage,toStage){

  if(isHatch){
    sc.classList.add('p3-shake');
    setTimeout(function(){
      sc.classList.remove('p3-shake');
      wrap.insertAdjacentHTML('beforeend','<div class="p3-crack" id="p3crack"></div>');
      setTimeout(function(){

        S.mascotSeenStage=toStage;S.mascotStageAt[0]=S.mascotStageAt[0]||todayKey();S.mascotStageAt[toStage]=todayKey();save();
      },420);
    },620);
  }else{
    sc.classList.add('p3-glowout');
    setTimeout(function(){
      renderPet3DBody(toStage);
      renderPet3DChrome(toStage);
      sc.classList.remove('p3-glowout');
      sc.classList.add('p3-pop');
      confetti();haptic([20,40,20]);
      toast('\u2728 '+S.mascotName+' is gegroeid naar '+petStageName(toStage)+'!');
      setTimeout(function(){sc.classList.remove('p3-pop');},700);
      S.mascotSeenStage=toStage;S.mascotStageAt[toStage]=todayKey();save();
    },520);
  }
}

const GEAR=[
  {id:'hat',slot:'head',emoji:'🎉',name:'Feesthoedje',price:150,desc:'Voor elke geslaagde klusdag een feestje.'},
  {id:'crown',slot:'head',emoji:'👑',name:'Kroontje',locked:true,unlock:'legende',desc:'Voor wie de hoogste fase heeft bereikt.'},

const EYE_REF=[null,{y:-16,z:44,g:16},{y:-16,z:50,g:18},{y:-18,z:54,g:19},{y:-20,z:58,g:20},{y:-22,z:62,g:22}];
function gearUnlocked(g){
  if(!g.locked)return true;
  if(g.unlock==='legende')return mascotStage()>=MASCOT_STAGES.length-1;
  return (S.badges||[]).indexOf(g.unlock)>=0;
}
function gearOwned(id){return S.owned.indexOf('gear:'+id)>=0;}
function gearEquipped(slot){return S.mascotEquip&&S.mascotEquip[slot]||null;}
function buyGear(id){
  const g=GEAR.find(x=>x.id===id);
  if(!g)return;
  if(gearOwned(id)){equipGear(id);return;}
  if(g.locked){
    if(!gearUnlocked(g))return;
    S.owned.push('gear:'+id);equipGear(id);return;
  }
  if(balance()<g.price){toast('Nog '+(g.price-balance())+' punten nodig voor '+g.name+'.');haptic([30,40]);return;}
  S.spent+=g.price;S.owned.push('gear:'+id);
  save();equipGear(id);
  toast('Gekocht: '+g.emoji+' '+g.name);
}
function equipGear(id){
  const g=GEAR.find(x=>x.id===id);
  if(!g||!gearOwned(id))return;
  S.mascotEquip=S.mascotEquip||{head:null,face:null,neck:null};
  S.mascotEquip[g.slot]=(S.mascotEquip[g.slot]===id)?null:id;
  save();renderPet3DBody(mascotStage());renderGearRow();checkBadges();
}
const HEAD_TOP=[null,-32,-42,-48,-56,-66];
const GEAR_SCALE=[0,1,1.07,1.14,1.21,1.3];
function gearParts(stage){
  const ref=EYE_REF[stage],top=HEAD_TOP[stage];
  if(!ref||top==null||!S.mascotEquip)return '';
  const sc=GEAR_SCALE[stage];
  let out='';
  const hd=S.mascotEquip.head,fc=S.mascotEquip.face,nk=S.mascotEquip.neck;
  if(hd==='hat'){
    const cw=25*sc,ch=30*sc;
    out+=tri('p3-hatcone',0,top-ch/2+5,8,cw,ch,0)
      +part('p3-hatball',0,top-ch+3,8,8*sc);
  }
  if(hd==='crown'){
    const bw=ref.g*2+14,bh=10*sc;
    out+=part('p3-crownband',0,top+bh/2-1,10,bw,bh);
    [-1,0,1].forEach(function(i){out+=tri('p3-crownspike',i*bw*0.3,top-5*sc,10,8*sc,12*sc,0);});
    out+=part('p3-jewel',0,top+bh/2-1,15,4*sc);
  }
  if(fc==='glasses'){
    out+=part('p3-glassring',-ref.g,ref.y+1,ref.z+7,16)
      +part('p3-glassring',ref.g,ref.y+1,ref.z+7,16)
      +part('p3-glassbar',0,ref.y+1,ref.z+7,ref.g*2-8,3);
  }
  const chinY=ref.y+70*sc,chinZ=Math.max(6,ref.z-38);
  if(nk==='bandana'){
    out+=part('p3-bandana',0,chinY,chinZ,ref.g*2+6,13*sc)
      +tri('p3-bandaknot',0,chinY+9*sc,chinZ+5,9*sc,11*sc,0);
  }
  if(nk==='bowtie'){
    out+=tri('p3-bowL',-6*sc,chinY,chinZ,13*sc,11*sc,20)
      +tri('p3-bowR',6*sc,chinY,chinZ,13*sc,11*sc,-20)
      +part('p3-jewel',0,chinY,chinZ+2,4*sc);
  }
  return out;
}
function renderGearRow(){
  const el=$('#p3-gear');
  if(!el)return;
  const stage=mascotStage();
  if(stage<1){el.innerHTML='<p class="p3-gear-hint">Eerst uitkomen voordat er kleertjes passen 🐣</p>';return;}
  el.innerHTML=GEAR.map(function(g){
    const owned=gearOwned(g.id),unlocked=gearUnlocked(g),on=gearEquipped(g.slot)===g.id;
    const cls='p3-gearchip'+(on?' on':'')+(!owned&&g.locked&&!unlocked?' locked':'');
    const sub=on?'Aan':(owned?'Uit':(g.locked?(unlocked?'Gratis':'🔒'):'\u2b50 '+g.price));
    return '<button type="button" class="'+cls+'" data-act="geartap" data-id="'+g.id+'" title="'+esc(g.name)+'"><span class="ge-e">'+g.emoji+'</span><span class="ge-n">'+esc(g.name)+'</span><span class="ge-s">'+sub+'</span></button>';
  }).join('');
}
function tapGear(id){
  const g=GEAR.find(x=>x.id===id);

    toast('🔒 '+(g.unlock==='legende'?'Bereik de hoogste fase om dit te ontgrendelen.':'Haal eerst de bijpassende prestatie.'));

function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const size=220;
      const c=document.createElement('canvas');c.width=size;c.height=size;
      const ctx=c.getContext('2d');
      const s=Math.max(size/img.width,size/img.height);
      const w=img.width*s,h=img.height*s;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      try{cb(c.toDataURL('image/jpeg',0.85));}catch(err){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=e.target.result;
  };
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}

  else if(a==='choosephoto'){const i=$('#avatarFile');if(i)i.click();}
  else if(a==='removephoto')removeAvatarPhoto();
  else if(a==='frametap')tapFrame(b.dataset.id);
  else if(a==='payrequest')openPayRequest();
  else if(a==='prshare')sharePayRequest();
  else if(a==='prcopylink')copyPayLink();
  else if(a==='copyiban'){try{navigator.clipboard.writeText(fmtIban(PAYVIEW.i||''));toast('IBAN gekopieerd');}catch(e){}}
  else if(a==='renamemascot')openMascotName();
  else if(a==='mnsave')saveMascotName();
  else if(a==='wnclose')closeWhatsNew();
  else if(a==='buy')buyItem(b.dataset.k,b.dataset.id);
  else if(a==='equip')equipItem(b.dataset.k,b.dataset.id);
  else if(a==='preview')previewTheme(b.dataset.id);
  else if(a==='useshield')useShield(b.dataset.key);
  else if(a==='dv'){
    S.dayView=b.dataset.v==='agenda'?'agenda':'list';save();renderDay();
    if(S.dayView==='agenda'&&S.sel===todayKey()){const n=$('#agnow');if(n)n.scrollIntoView({block:'center',behavior:'smooth'});}
  }
  else if(a==='claim')claimMission();
  else if(a==='agev')openTaskSheet({mode:'edit',key:b.dataset.key,id:b.dataset.id});
  else if(a==='agcheck')toggleDone(b.dataset.key,b.dataset.id);
  else if(a==='lockat'){
    const it=(S.plan[LK.key]||[]).find(x=>x.id===b.dataset.id);
    if(it){it.at=LK.at;const nm=it.name,at=LK.at;save();closeSheet();renderAll();toast(nm+' staat vast op '+at);checkBadges();}
  }
  else if(a==='lockgo'){closeSheet();setTab('tasks');}
  else if(a==='tat'){TS.at=b.dataset.t;redraw();}
  else if(a==='tatclear'){TS.at=null;redraw();}
  else if(a==='remindtoggle'){
    S.remind.on=!S.remind.on;save();renderHome();
    if(S.remind.on){
      try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission();}catch(e){}
      toast('Herinneringen staan aan.');
    }
  }
  else if(a==='remindlead'){S.remind.lead=Number(b.dataset.m);save();renderHome();}
  else if(a==='exportics')exportICS();
  else if(a==='tw'){TS.w=Number(b.dataset.w);redraw();}
  else if(a==='fw'){FM.w=Number(b.dataset.w);redraw();}
});
document.addEventListener('input',function(e){
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;renderTaskList();}
  else if(id==='prof-name'){saveProfileName(e.target.value,true);}
  else if(id==='avatarFile'){onAvatarFile(e.target);}
  else if(id==='prof-iban'){S.profileIban=e.target.value.replace(/\s+/g,'').toUpperCase();save();}
  else if(id==='pr-amount'){PR.amount=e.target.value;refreshPrQr();}
  else if(id==='pr-desc'){PR.desc=e.target.value;}
  else if(FM&&id==='f-name'){FM.name=e.target.value;FM.err='';}
  else if(FM&&id==='f-bname'){FM.bname=e.target.value;FM.err='';}
  else if(FM&&id==='f-bemoji'){FM.bemoji=e.target.value;}
  else if(TS&&id==='t-name'){TS.name=e.target.value;TS.err='';}
  else if(TS&&id==='t-note'){TS.note=e.target.value;}
  else if(TS&&id==='t-at'){TS.at=e.target.value||null;}
  else if(LK&&id==='lk-at'){if(e.target.value)LK.at=e.target.value;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&CUR)closeSheet();
  if(e.key==='Escape'&&!$('#pet3d').hidden)closePet3D();
  if(e.key==='Enter'){
    const id=e.target.id;
    if(FM&&(id==='f-name'||id==='f-bname')){e.preventDefault();saveNewTask();}
    else if(TS&&(id==='t-name'||id==='t-note')){e.preventDefault();saveTaskSheet();}
    else if(id==='mn-name'){e.preventDefault();saveMascotName();}
    else if(id==='prof-name'){e.preventDefault();const i=$('#prof-name');if(i)i.blur();}
    else if(id==='li-name'){e.preventDefault();const i=$('#li-name');if(addLi(i.value)){const n=$('#li-name');if(n)n.focus();}}
    else if(id==='p-name'){e.preventDefault();const i=$('#p-name');if(addPerson(i.value)){const n=$('#p-name');if(n)n.focus();}}
  }
});
let lastToday=todayKey();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&todayKey()!==lastToday){lastToday=todayKey();goToday();}
  if(!document.hidden)tick();
});

/* ---------- start ---------- */
applyTheme();
applyThemeStyle();
const now=new Date();
S.weekStart=mondayOf(now);
S.sel=keyOf(now);
if(S.badges===null){S.badges=BADGES.filter(b=>b.cur(calcStats())>=b.goal).map(b=>b.id);save();}
THEMES.forEach(function(t){if(t.locked&&themeUnlocked(t)&&S.owned.indexOf('theme:'+t.id)<0)S.owned.push('theme:'+t.id);});
try{
  const qs=new URLSearchParams(location.search);
  const qt=qs.get('tab');
  if(qt&&['day','week','tasks','list','ranks','home'].indexOf(qt)>=0)S.tab=qt;
  const payParam=qs.get('pay');
  if(payParam){
    PAYVIEW=JSON.parse(b64urlDecode(payParam));
    try{history.replaceState(null,'',location.pathname+(qt?('?tab='+qt):''));}catch(e){}
  }
}catch(e){}
S.anim=true;
renderAll();
runSplash();
setInterval(tick,15000);
tick();
try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
}catch(e){}
})();
</script>
</body>
</html>
