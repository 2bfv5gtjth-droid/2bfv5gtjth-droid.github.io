<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Huisweek</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Huisweek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F4BF0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20viewBox%3D'0%200%201024%201024'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%234C66FF'/%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%232233CC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D'1024'%20height%3D'1024'%20rx%3D'232'%20fill%3D'url(%23g)'/%3E%3Cpath%20d%3D'M512%20206%20L846%20484%20V822%20H178%20V484%20Z'%20fill%3D'%23fff'%20stroke%3D'%23fff'%20stroke-width%3D'48'%20stroke-linejoin%3D'round'/%3E%3Cpath%20d%3D'M368%20552%20L476%20660%20L664%20458'%20fill%3D'none'%20stroke%3D'%231FA267'%20stroke-width%3D'70'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#151A27; --muted:#667085; --line:#E1E5EC; --line-strong:#C9CFDA;
  --accent:#2F4BF0; --on-accent:#FFFFFF; --ok:#1F9D63; --danger:#D9433B;
  --toast-btn:#9DB0FF;
  --c-s:62%; --c-l:44%; --soft-s:75%; --soft-l:93%; --on-c:#FFFFFF;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --surface:#171B24; --ink:#EDF0F6; --muted:#98A1B3; --line:#252B37; --line-strong:#3A4252;
    --accent:#8DA1FF; --on-accent:#0E1117; --ok:#3CC885; --danger:#F07168;
    --toast-btn:#2F4BF0;
    --c-s:75%; --c-l:68%; --soft-s:38%; --soft-l:21%; --on-c:#0E1117;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B24; --ink:#EDF0F6; --muted:#98A1B3; --line:#252B37; --line-strong:#3A4252;
  --accent:#8DA1FF; --on-accent:#0E1117; --ok:#3CC885; --danger:#F07168;
  --toast-btn:#2F4BF0;
  --c-s:75%; --c-l:68%; --soft-s:38%; --soft-l:21%; --on-c:#0E1117;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

.cat{--c:hsl(var(--h) var(--c-s) var(--c-l));--soft:hsl(var(--h) var(--soft-s) var(--soft-l))}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:12px 0 10px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-bottom:12px}
#top.compact-top .top-row{margin-bottom:0}
h1{margin:0;font-size:27px;line-height:1.05;font-weight:800;letter-spacing:-.025em;font-variation-settings:"opsz" 72;white-space:nowrap}
#wk{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.wnav{display:flex;gap:6px;flex:none}
.wnav button{height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:grid;place-items:center}
.wnav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:390px){h1{font-size:22px}.wnav{gap:4px}.wnav button{height:33px;min-width:33px;padding:0 7px;font-size:13px}.top-row{gap:4px}#topAvatar .avatar{width:33px!important;height:33px!important}}
@media (max-width:340px){h1{font-size:19px}.wnav button{min-width:30px;padding:0 5px;font-size:12.5px}#wk{font-size:12px}#topAvatar{margin-left:0}}

.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day .dn{font-size:12px;font-weight:600;color:var(--muted)}
.day .dd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700}
.day .dots{display:flex;gap:3px;height:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) var(--c-s) var(--c-l))}
.dot.done{opacity:.3}
.day.today .dd{background:var(--accent);color:var(--on-accent)}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .dn{color:inherit;opacity:.7}

/* main */
main.wrap{padding-top:6px;padding-bottom:120px;outline:none}
.dayhead h2{margin:8px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.greet{margin:10px 0 0;color:var(--accent);font-weight:700;font-size:14.5px}
.greet + h2{margin-top:2px}
.dayhead p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.dayhead p.greet{margin:10px 0 0;color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pill{font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s ease}
.list{display:flex;flex-direction:column;gap:8px}
.tip{margin:12px 2px 0;color:var(--muted);font-size:13.5px}
.tgrp{margin:16px 0 8px 2px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.tgrp:first-of-type{margin-top:6px}

.enter .swipe{animation:rowIn .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* swipe rows */
.swipe{position:relative;border-radius:16px;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.swipe .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--on-bg,#fff);font-weight:700;font-size:15px}
.swipe[data-dir="r"] .bg{background:var(--rbg,var(--ok))}
.swipe[data-dir="l"] .bg{background:var(--danger);color:#fff}
.swipe .bg span{opacity:0;transition:transform .15s}
.swipe[data-dir="r"] .bg-r{opacity:1}
.swipe[data-dir="l"] .bg-l{opacity:1}
.swipe.armed .bg span{transform:scale(1.12)}
.swipe.lib{--rbg:var(--c);--on-bg:var(--on-c)}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform}
.swipe.dragging .card{transition:none}
.tile{flex:none;width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px}
.txt{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:1px}
.sub .cn{color:var(--c);font-weight:600}
.rep{display:inline-flex;align-items:center}
.rep svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.isdone .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.card.isdone .tile{opacity:.5}
.av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-size:12px;font-weight:700}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] svg{opacity:1}
.check.pop{animation:popCheck .42s cubic-bezier(.2,.9,.3,1.4)}
@keyframes popCheck{0%{transform:scale(.6)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
.addbtn{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--c);display:grid;place-items:center;padding:0}
.addbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.planned{flex:none;font-size:12px;font-weight:600;color:var(--c);background:var(--soft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.compact .card{padding:7px 10px;gap:10px}
.compact .tile{width:34px;height:34px;font-size:18px;border-radius:11px}
.compact .nm{font-size:15px}
.compact .check{width:28px;height:28px}
.compact .av{width:24px;height:24px;font-size:11px}

.addmore{width:100%;margin-top:10px;padding:13px;border-radius:16px;border:1.5px dashed var(--line-strong);background:transparent;font-weight:600;font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:10px 4px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.empty{text-align:center;padding:38px 20px 20px}
.empty .big{font-size:40px;margin-bottom:6px}
.empty h3{margin:0 0 6px;font-size:20px;font-weight:700}
.empty p{margin:0 auto 18px;max-width:30ch;color:var(--muted);font-size:15px}
.empty.small{padding:28px 10px}

.btn{font-weight:600;font-size:15px;border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.wide{width:100%}

.tipcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0 14px}
.tipcard h3{margin:0 0 8px;font-size:19px;font-weight:700}
.tipcard ul{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:14.5px}
.tipcard li{margin-bottom:5px}
.tipcard li b{color:var(--ink)}
.tipcard .row{display:flex;gap:8px;flex-wrap:wrap}

/* week */
.wk{margin:0 0 20px}
.wk-head{display:flex;width:100%;justify-content:space-between;align-items:baseline;background:none;border:0;padding:4px 2px 8px;text-align:left}
.wk-name{font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.wk-name b{font-weight:800}
.wk.today .wk-name::after{content:"Vandaag";font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);padding:2px 8px;border-radius:99px}
.wk-meta{font-size:13px;color:var(--muted)}
.wk-empty{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;border:1.5px dashed var(--line-strong);border-radius:14px;color:var(--muted);font-size:14px}
.wk-empty button{border:0;background:transparent;font-weight:600;font-size:14px;padding:6px 12px;border-radius:10px;color:var(--accent)}

/* tasks */
.hint{margin:8px 2px 12px;color:var(--muted);font-size:14.5px}
.hint b{color:var(--ink);font-weight:700}
.hint.sm{margin:0 2px 4px;font-size:13.5px}
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.btn-new{flex:none;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:0 16px;font-weight:700;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--c);color:var(--on-c);border-color:transparent}
.chip.all.on{background:var(--ink);color:var(--bg)}
.grp{margin-top:14px}
.grp h3{margin:0 0 8px 2px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.grp .ge{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:16px}
.grp .gc{font-size:13px;font-weight:600;color:var(--muted)}

/* thuis */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hcard h3{margin:0 0 12px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.hcard p.sm{margin:0 0 12px;color:var(--muted);font-size:14px}
.hero{background:linear-gradient(135deg,#4C66FF,#2233CC);color:#fff;border:0}
.hero-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.hero .lvl-emoji{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:28px}
.lvl-name{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.hero-top>div:last-child{min-width:0}
.lvl-sub{overflow-wrap:anywhere}
.rc-rank,.ld-t b{overflow-wrap:anywhere}
.lvl-sub{font-size:13.5px;opacity:.88;margin-top:2px}
.hbar{height:8px;background:rgba(255,255,255,.24);border-radius:99px;overflow:hidden;margin-bottom:14px}
.hbar i{display:block;height:100%;background:#fff;border-radius:99px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 4px;text-align:center}
.stats3 b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stats3 span{font-size:12px;opacity:.88}
.sum{display:flex;gap:18px;align-items:center}
.ring{--p:0;flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center}
.ring-in{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.ring-in b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sum h3{margin:0 0 2px}
.sum p{margin:0;color:var(--muted);font-size:14px}
.brow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.brow:last-child{margin-bottom:0}
.brow .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bc{color:var(--muted);font-size:13px;min-width:34px;text-align:right}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:99px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-weight:600;font-size:15.5px}
.prow .pt span{font-size:13px;color:var(--muted)}
.prow .tile{width:36px;height:36px;font-size:18px;border-radius:11px}
.prow .medal{flex:none;width:28px;text-align:center;font-size:22px}
.prow .pts{flex:none;font-weight:800;font-size:16px}
.iconbtn{flex:none;border:0;background:transparent;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);padding:0}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.textbtn{flex:none;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--danger);padding:6px 8px;border-radius:10px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .inp{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:600;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line-strong)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px 2px 4px}
#nav button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--ink)}
#nav button[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.2}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:75;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:14px;max-width:min(92vw,520px);font-size:14.5px;font-weight:500;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#toast button{flex:none;background:none;border:0;padding:2px 4px;font-weight:700;font-size:14.5px;color:var(--toast-btn)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40}
.sheet .backdrop{position:absolute;inset:0;background:rgba(10,14,24,.5);opacity:0;transition:opacity .2s}
.sheet.open .backdrop{opacity:1}
.panel{position:absolute;left:50%;bottom:0;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto 12px}
.panel h2{margin:0 0 14px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sh-top{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.sh-top h2{margin:0;line-height:1.2}
.sh-top .inp{flex:1;min-width:0;font-weight:600}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.cat.on{background:var(--c);color:var(--on-c);border-color:transparent}
.row2{display:flex;gap:10px}
.row2 .em{width:84px;flex:none}
.row2 .grow{flex:1;min-width:0}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-weight:600;text-align:left;margin-bottom:16px}
.toggle .knob{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"] .knob{background:var(--ok)}
.toggle[aria-checked="true"] .knob::after{transform:translateX(18px)}
.help{margin:-8px 2px 16px;color:var(--muted);font-size:13.5px}
.err{color:var(--danger);font-size:13.5px;margin:-8px 0 12px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1;padding:13px}

/* timer */
#timer{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.tm-wrap{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.tm-top{display:flex;justify-content:flex-end;min-height:44px}
.tm-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.tm-emoji{font-size:44px}
.tm-body h2{margin:4px 0 22px;font-size:24px;font-weight:800;letter-spacing:-.02em;max-width:22ch}
.tm-ring{--p:0;width:250px;height:250px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center}
.tm-in{width:222px;height:222px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tm-in b{font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.tm-in span{color:var(--muted);font-size:14.5px;font-weight:600}
.tm-actions{display:flex;gap:10px}
.tm-actions .btn{flex:1;padding:15px;font-size:16.5px}
.tm-over .tm-ring{background:var(--ok)}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 28%,#1D2760 0%,#0B0F1E 70%);color:#fff;transition:opacity .45s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.sp-inner{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;text-align:center}
.sp-icon{width:132px;height:132px;margin-bottom:6px;filter:drop-shadow(0 18px 40px rgba(47,75,240,.5));animation:spPop .7s cubic-bezier(.2,.9,.25,1.2) both}
.sp-house{animation:spHouse .6s .1s cubic-bezier(.2,.9,.25,1.1) both}
.sp-check{stroke-dasharray:420;stroke-dashoffset:420;animation:spDraw .55s .65s ease-out forwards}
.sp-title{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-.03em;animation:spUp .6s .85s both}
.sp-tag{color:#A9B4D8;font-size:16px;animation:spUp .6s 1.05s both}
@keyframes spPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes spHouse{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* intro */
#intro{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 24px calc(env(safe-area-inset-bottom,0px) + 22px);transition:opacity .3s ease}
#intro.out{opacity:0;pointer-events:none}
.in-wrap{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.in-top{display:flex;justify-content:flex-end;min-height:44px}
.in-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.in-body.anim{animation:inUp .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes inUp{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.in-body h2{margin:18px 0 0;font-size:29px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.in-body p{margin:8px 0 0;max-width:32ch;color:var(--muted);font-size:16.5px}
.in-bot{display:flex;flex-direction:column;align-items:center;gap:18px}
.dots2{display:flex;gap:7px;align-items:center;height:10px}
.dots2 i{width:8px;height:8px;border-radius:99px;background:var(--line-strong);transition:width .25s,background .25s}
.dots2 i.on{width:24px;background:var(--ink)}
.ill{width:100%;min-height:170px;display:grid;place-items:center}
.mock{position:relative;width:min(320px,88%);border-radius:16px;overflow:hidden}
.mock.cat{background:var(--c);--on:var(--on-c)}
.mock.done{background:var(--ok);--on:#fff}
.mock .mbg{position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;color:var(--on);font-weight:700;font-size:15px}
.mock .mcard{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;animation:mswipe 2.8s ease-in-out .3s infinite}
.mock .mcard b{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.25}
@keyframes mswipe{0%,18%{transform:translateX(0)}42%,66%{transform:translateX(150px)}90%,100%{transform:translateX(0)}}
.mock2{width:min(340px,92%);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;pointer-events:none}
.mock2 .toggle{margin:0}
.mock2 .lvlrow{display:flex;gap:12px;align-items:center}
.mock2 .lvlrow span{font-size:30px}
.mock2 .lvlrow b{display:block;font-size:18px;font-weight:800}
.mock2 .lvlrow small{color:var(--muted);font-size:13px}
.mock2 .bar2{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.mock2 .bar2 i{display:block;width:62%;height:100%;background:var(--accent);border-radius:99px}

/* extra: late banner, verras me, prestaties, heatmap */
.late{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid #F5A524;border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}
.late .lt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.late .lt b{display:block;font-weight:700}
.late .lt span{color:var(--muted)}
.late .btn{padding:9px 12px;font-size:14px;white-space:nowrap}
.sug{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg);margin-bottom:14px;animation:rowIn .3s cubic-bezier(.2,.8,.2,1) both}
.sug .tile{width:54px;height:54px;font-size:28px;border-radius:16px}
.sug .nm{font-size:18px;font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.bdg .be{font-size:28px;line-height:1.1}
.bdg b{font-size:15px;font-weight:700;overflow-wrap:anywhere;hyphens:auto}
.bdg{min-width:0}
.bdg span:not(.be){font-size:12.5px;color:var(--muted);line-height:1.3}
.bdg.locked{opacity:.62}
.bdg.locked .be{filter:grayscale(1)}
.bdg.got{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.bp{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bp i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hm-head,.hm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hm-head span{text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.hm{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted)}
.hm.l1{background:var(--line);color:var(--ink)}
.hm.l2{background:color-mix(in srgb,var(--ok) 42%,var(--surface));color:var(--ink)}
.hm.l3{background:var(--ok);color:var(--on-c)}
.hm.fut{opacity:.45}
.hm.now{box-shadow:0 0 0 2px var(--accent)}

/* winkel */
#splash{background:radial-gradient(120% 80% at 50% 28%,var(--splash1,#1D2760) 0%,var(--splash2,#0B0F1E) 70%)}
.hero{background:var(--hero,linear-gradient(135deg,#4C66FF,#2233CC))}
.heroBtn{width:100%;margin-top:12px;background:rgba(255,255,255,.2);border:0;color:#fff;font-weight:700}
.floatpts{position:fixed;z-index:72;font-weight:800;font-size:19px;color:var(--ok);pointer-events:none;transform:translate(-50%,0);animation:floatUp 1s ease-out forwards;text-shadow:0 1px 0 var(--surface),0 0 8px var(--surface)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-52px)}}
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shopc{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.shopc.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch{height:64px;border-radius:12px;display:grid;place-items:center;font-size:28px}
.shopc b{font-size:15.5px;font-weight:700}
.shopc small{color:var(--muted);font-size:12.5px;line-height:1.3;flex:1}
.shopc .btn{padding:9px 8px;font-size:14px}
.btn.locked{color:var(--muted)}
.btn[disabled]{opacity:.7;cursor:default}

/* agenda, missie, volgende */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px;margin:6px 0 2px}
.seg2 button{border:0;background:transparent;padding:8px 0;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sub .clk{font-weight:700;color:var(--ink)}
.mission{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px;box-shadow:inset 4px 0 0 var(--accent)}
.ms-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;color:var(--accent)}
.ms-txt{margin-top:6px;font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;line-height:1.25}
.ms-e{font-size:22px}
.ms-sub{font-size:13px;color:var(--muted);font-weight:600}
.ms-done{color:var(--ok);font-weight:800;font-size:14.5px}
.mission.cm{display:flex;align-items:center;gap:12px;padding:10px 14px}
.ms-cmt{flex:1;min-width:0}
.ms-cmt b{display:block;font-size:14.5px;line-height:1.25}
.ms-cmt span{font-size:12.5px;color:var(--muted)}
.mission.cm .btn{padding:8px 12px;font-size:14px}
.nextup{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.nextup .nu-e{font-size:24px}
.nextup b{display:block;font-size:15.5px}
.nextup span{color:var(--muted);font-size:13.5px}
.ag{position:relative;margin:6px 0 8px}
.ag-h{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.ag-h span{position:absolute;left:0;top:-9px;width:42px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg)}
.ag-body{position:absolute;left:48px;right:0;top:0;cursor:pointer}
.ag-ev{position:absolute;box-sizing:border-box;padding:4px 6px 4px 10px;border-radius:12px;background:var(--soft);border-left:4px solid var(--c);display:flex;align-items:center;gap:8px;overflow:hidden;cursor:pointer;z-index:1}
.ag-ev .ag-em{font-size:18px;flex:none}
.ag-ev .ag-tx{flex:1;min-width:0;line-height:1.2}
.ag-ev b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev .tm{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev.nar .ag-em{display:none}
.ag-ev.nar{padding-left:8px}
.ag-ev.sm b{font-size:13.5px}
.ag-ev .check{width:26px;height:26px;flex:none}
.ag-ev.isdone{opacity:.55}
.ag-ev.isdone b{text-decoration:line-through}
.ag-now{position:absolute;left:40px;right:0;height:0;border-top:2px solid var(--danger);pointer-events:none;z-index:2}
.ag-now::before{content:"";position:absolute;left:-4px;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--danger)}
.lkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.lkrow .lktx b{display:block;font-weight:600;font-size:15.5px}
.lkrow .lktx small{color:var(--muted);font-size:13px}

/* rangen */
.rcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.rcard .tile{width:46px;height:46px;font-size:23px}
.rc-tx{flex:1;min-width:0}
.rc-name{font-size:13px;color:var(--muted);font-weight:600}
.rc-rank{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:1px 0 7px;line-height:1.2}
.rc-rank small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.rc-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.rc-arrow{font-size:24px;color:var(--muted);flex:none}
.rk-total{display:flex;gap:12px;align-items:center;padding:12px 14px}
.rk-total .lvl-emoji-s{font-size:30px}
.rk-total b{display:block;font-size:17px;font-weight:800}
.rk-total span:not(.lvl-emoji-s){font-size:13px;color:var(--muted)}
.rk-hero{background:linear-gradient(135deg,hsl(var(--h) 66% 50%),hsl(var(--h) 66% 32%))}
.ladder{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hcard h3 + .ladder{border-top:0}
.ld-e{font-size:26px;width:38px;text-align:center;flex:none}
.ladder.locked .ld-e{filter:grayscale(1);opacity:.45}
.ld-t{flex:1;min-width:0}
.ld-t b{display:block;font-size:15.5px;font-weight:700}
.ladder.locked .ld-t b{color:var(--muted)}
.ld-t span{font-size:13px;color:var(--muted)}
.ld-n{font-weight:800;font-size:14px;color:var(--ok);flex:none}
.ladder.locked .ld-n{color:var(--muted);font-weight:600}
.ladder.cur{background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:12px;padding-left:8px;padding-right:8px;margin:0 -8px;border-top-color:transparent}
.grp h3 .rk{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--c)}

/* klusmaatje */
.mascot{display:flex;flex-direction:column}
.mas-row{display:flex;align-items:center;gap:14px}
.mas-av{flex:none;width:64px;height:64px;border-radius:18px;background:var(--soft-ui,var(--bg));background:color-mix(in srgb,var(--accent) 12%,var(--bg));border:0;font-size:34px;display:grid;place-items:center}
.mas-av.bounce{animation:masBounce .5s cubic-bezier(.3,1.4,.4,1)}
@keyframes masBounce{0%{transform:scale(1)}35%{transform:scale(1.25) rotate(-6deg)}65%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
.mas-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mas-name{align-self:flex-start;background:none;border:0;padding:0;font-size:16.5px;font-weight:800;color:var(--ink)}
.mas-mood{font-size:13px;color:var(--muted)}
.mascot .btn{flex:none;padding:10px 16px}
/* wat is er nieuw */
#whatsnew{position:fixed;inset:0;z-index:95;opacity:0;pointer-events:none;transition:opacity .25s ease}
#whatsnew.open{opacity:1;pointer-events:auto}
#whatsnew .backdrop2{position:absolute;inset:0;background:rgba(10,14,24,.55)}
.wn-card{position:relative;max-width:420px;max-height:78vh;overflow:auto;margin:12vh auto 0;background:var(--surface);border-radius:22px;padding:26px 22px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.wn-e{font-size:44px;margin-bottom:6px;line-height:1}
.wn-card h2{margin:0 0 14px;font-size:22px;font-weight:800;line-height:1.2}
.wn-ul{margin:0 0 6px;padding-left:20px;color:var(--ink)}
.wn-ul li{margin-bottom:10px;font-size:15px;line-height:1.4}
.wn-card .btn{margin-top:8px}

.excl{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:99px}
.swatch{position:relative}
.shopc.dimmed{opacity:.62}
.shopc.dimmed .swatch{filter:grayscale(.35)}
.lockline{margin-top:2px;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35;padding:9px 8px;background:var(--bg);border-radius:10px;text-align:center}
html.theme-stars body{background-image:radial-gradient(1.5px 1.5px at 20% 15%,rgba(255,255,255,.55) 50%,transparent 52%),radial-gradient(1.5px 1.5px at 70% 8%,rgba(255,255,255,.4) 50%,transparent 52%),radial-gradient(1px 1px at 45% 25%,rgba(255,255,255,.5) 50%,transparent 52%),radial-gradient(1.5px 1.5px at 85% 35%,rgba(255,255,255,.35) 50%,transparent 52%),radial-gradient(1px 1px at 10% 45%,rgba(255,255,255,.4) 50%,transparent 52%),radial-gradient(1.5px 1.5px at 60% 55%,rgba(255,255,255,.3) 50%,transparent 52%);background-repeat:no-repeat;background-attachment:fixed}
html.theme-stars #splash{background-image:radial-gradient(2px 2px at 15% 20%,#fff 50%,transparent 52%),radial-gradient(2px 2px at 80% 15%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 50% 10%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 30% 60%,#fff 50%,transparent 52%),radial-gradient(2px 2px at 90% 70%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 65% 45%,#fff 50%,transparent 52%)}

/* klusmaatje in 3D */
.mas-3dlink{align-self:flex-start;background:none;border:0;padding:2px 0 0;font-size:13px;font-weight:700;color:var(--accent)}
#pet3d{position:fixed;inset:0;z-index:85;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .28s ease;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
#pet3d.open{opacity:1;pointer-events:auto}
.p3-wrap{width:100%;max-width:480px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
.p3-top{display:flex;justify-content:flex-end;min-height:40px}
.p3-head{text-align:center;margin:2px 0 6px}
.p3-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.p3-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.p3-next{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 10px;border-radius:99px}
#pet3d{--pc:var(--accent);--pc-l:color-mix(in srgb, var(--accent) 45%, white);--pc-d:color-mix(in srgb, var(--accent) 68%, black)}
.p3-viewport{height:270px;flex:none;display:flex;align-items:center;justify-content:center;perspective:900px;touch-action:none;cursor:grab;position:relative}
.p3-viewport::before{content:'';position:absolute;left:50%;top:50%;width:280px;height:280px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent) 0%,transparent 68%);pointer-events:none}
.p3-viewport::after{content:'';position:absolute;left:50%;bottom:10px;width:220px;height:220px;transform:translate(-50%,0);border-radius:50%;background:radial-gradient(ellipse 50% 100% at 50% 100%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%);pointer-events:none}
.p3-viewport.grab{cursor:grabbing}
.p3-scene{position:relative;width:2px;height:2px;transform-style:preserve-3d;animation:p3bob 3.2s ease-in-out infinite}
@keyframes p3bob{0%,100%{margin-top:0}50%{margin-top:-10px}}
.p3-scene.p3-shake{animation:p3bob 3.2s ease-in-out infinite, p3shake .12s ease-in-out infinite}
@keyframes p3shake{0%,100%{transform:translateX(0) rotateZ(0)}25%{transform:translateX(-3px) rotateZ(-2deg)}75%{transform:translateX(3px) rotateZ(2deg)}}
.p3-scene.p3-burst{animation:none;transform:scale(0.01)!important;transition:transform .18s ease-in}
.p3-scene.p3-pop{animation:p3bob 3.2s ease-in-out infinite, p3pop .55s cubic-bezier(.2,1.4,.35,1) both}
@keyframes p3pop{0%{transform:scale(.2)}55%{transform:scale(1.16)}80%{transform:scale(.94)}100%{transform:scale(1)}}
.p3-scene.p3-glowout{filter:brightness(2.6) saturate(0);transition:filter .5s ease}
.p3-anchor{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.p3-part{position:absolute;left:0;top:0;transform-style:flat}
.p3-ball{border-radius:50%;background:radial-gradient(circle at 32% 26%, var(--pc-l), var(--pc) 55%, var(--pc-d) 100%);box-shadow:inset -8px -10px 16px rgba(0,0,0,.22), inset 4px 6px 10px rgba(255,255,255,.28)}
.p3-egg{border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;background:radial-gradient(circle at 34% 24%, var(--pc-l), var(--pc) 55%, var(--pc-d) 100%);box-shadow:inset -8px -10px 18px rgba(0,0,0,.22), inset 4px 6px 12px rgba(255,255,255,.3)}
.p3-eye-w{background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.p3-eye-b{background:#151A27;border-radius:50%}
.p3-wing{background:linear-gradient(135deg, var(--pc-l), var(--pc-d));clip-path:polygon(0 100%,100% 55%,58% 0,18% 32%);box-shadow:0 3px 8px rgba(0,0,0,.22);opacity:.96}
.p3-horn{background:linear-gradient(180deg, var(--pc-l), var(--pc-d));clip-path:polygon(50% 0,0 100%,100% 100%)}
.p3-spot{border-radius:50%;background:var(--pc-d);opacity:.42}
.p3-glow{border-radius:50%;background:radial-gradient(circle,#fff,transparent 70%);opacity:.9;filter:blur(1px)}
.p3-aura{position:absolute;left:50%;top:50%;width:220px;height:220px;transform:translate3d(-110px,-110px,-40px);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,transparent),transparent 70%);animation:p3aura 2.4s ease-in-out infinite}
@keyframes p3aura{0%,100%{opacity:.5;transform:translate3d(-110px,-110px,-40px) scale(1)}50%{opacity:.85;transform:translate3d(-110px,-110px,-40px) scale(1.12)}}
.p3-ringdot{border-radius:50%;background:var(--pc-l);box-shadow:0 0 8px var(--pc-l);animation:p3twinkle 1.6s ease-in-out infinite}
@keyframes p3twinkle{0%,100%{opacity:.4;filter:brightness(1)}50%{opacity:1;filter:brightness(1.6)}}
.p3-crack{position:absolute;left:50%;top:46%;width:70px;height:70px;transform:translate(-50%,-50%);background:
  linear-gradient(105deg,transparent 47%,var(--pc-d) 48%,var(--pc-d) 50%,transparent 51%),
  linear-gradient(15deg,transparent 47%,var(--pc-d) 48%,var(--pc-d) 50%,transparent 51%);
  opacity:0;animation:p3crackin .18s ease forwards}
@keyframes p3crackin{to{opacity:.85}}
.p3-shadow{width:130px;height:24px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.26),transparent 70%);margin-top:-10px;position:relative;z-index:-1}
.p3-hint{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 10px}
.p3-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px;margin:0 0 14px}
.p3-panel .frame-row,.p3-panel .p3-gear{margin:10px -20px 0;padding-left:20px;padding-right:20px}
.p3-actions{display:flex;gap:10px}
.p3-actions .btn{flex:1;padding:13px}

/* pet: voortgangsbalk */
.pet-bar{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.pet-bar.sm{margin-top:4px}
.pet-bar-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.pet-bar-track i{display:block;height:100%;background:linear-gradient(90deg,var(--pc-l,var(--accent)),var(--accent));border-radius:99px;transition:width .4s ease}
.pet-bar-lbl{font-size:12px;color:var(--muted);font-weight:600}

/* pet: accessoires op het figuur (vaste kleuren, niet thema-gebonden) */
.p3-hatcone{background:linear-gradient(180deg,#FFD24C,#E8590C);clip-path:polygon(50% 0,0 100%,100% 100%)}
.p3-hatball{border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.2)}
.p3-crownband{background:linear-gradient(180deg,#FFE187,#D9A62B);border-radius:5px}
.p3-crownspike{background:linear-gradient(180deg,#FFE187,#D9A62B);clip-path:polygon(50% 0,10% 100%,90% 100%)}
.p3-jewel{background:#E5484D;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,.25)}
.p3-glassring{border-radius:50%;background:#20242c;box-shadow:0 0 0 2px #444 inset}
.p3-glassbar{background:#20242c}
.p3-bandana{background:repeating-linear-gradient(45deg,#E5484D,#E5484D 6px,#C22 6px,#C22 12px);border-radius:5px}
.p3-bandaknot{background:#C22;clip-path:polygon(50% 0,0 100%,100% 100%)}
.p3-bowL{background:#3B5BDB;clip-path:polygon(100% 0,0 50%,100% 100%)}
.p3-bowR{background:#3B5BDB;clip-path:polygon(0 0,100% 50%,0 100%)}

/* pet: uitrusting-rij in de 3D viewer */
.p3-gear{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 10px;padding:2px 20px 4px;scrollbar-width:none}
.p3-gear::-webkit-scrollbar{display:none}
.p3-gear-hint{width:100%;text-align:center;color:var(--muted);font-size:13px;margin:0 0 8px}
.p3-gearchip{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.p3-gearchip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.p3-gearchip.locked{opacity:.55}
.p3-gearchip .ge-e{font-size:22px}
.p3-gearchip .ge-n{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.p3-gearchip .ge-s{font-size:10.5px;color:var(--muted);font-weight:700}
.p3-gearchip.on .ge-s{color:var(--accent)}

/* pet: levensverhaal */
.p3-story{width:100%;margin:6px 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.p3-story h3{margin:0 0 8px;font-size:15px;font-weight:800}
.p3-story-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
.p3-story-row:first-of-type{border-top:0;padding-top:0}
.p3-story-d{color:var(--muted);white-space:nowrap}

/* pet: hartjes-reactie */
.p3-heart{position:fixed;z-index:96;font-size:20px;pointer-events:none;animation:p3heart 1.1s ease-out forwards}
@keyframes p3heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(.9)}}

/* mood: slaapoogjes + zzz in 3D */
.p3-eye-sleepy{background:transparent;border-bottom:3px solid #151A27;border-radius:0 0 50% 50%/0 0 100% 100%;height:6px!important}
.p3-zzz{color:var(--pc-l,var(--accent));font-weight:800;font-size:13px;animation:p3zdrift 2.4s ease-in-out infinite}
@keyframes p3zdrift{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

/* profiel & avatar */
#topAvatar{flex:none;margin-left:2px;display:flex;align-items:center}
.avatar{position:relative;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;padding:0;border:0;flex:none;box-sizing:border-box}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .av-ph{font-size:1.4em;color:var(--muted);font-weight:800}
.frm-none{box-shadow:0 0 0 2px var(--line)}
.frm-accent{box-shadow:0 0 0 3px var(--accent)}
.frm-dashed{box-shadow:none;border:3px dashed var(--accent)}
.frm-rainbow{box-shadow:0 0 0 3px transparent;background:conic-gradient(#FF5252,#FFD24C,#4CD964,#2FA8FF,#B197FC,#FF5252);padding:3px}
.frm-fire{padding:3px;background:linear-gradient(135deg,#FFD24C,#E8590C,#C0392B)}
.frm-ice{padding:3px;background:linear-gradient(135deg,#EAF9FF,#5AC8EE,#0A7EA4)}
.frm-gold{padding:3px;background:linear-gradient(135deg,#FFEBAE,#F2C94C,#A9700F)}
.frm-legend{padding:3px;background:conic-gradient(from 0deg,#8258FF,#5AC8EE,#F2C94C,#FF5EA8,#8258FF);animation:frmspin 4s linear infinite}
@keyframes frmspin{to{filter:hue-rotate(360deg)}}
.frame-prev{width:44px;height:44px;margin-bottom:4px}
.frame-chip{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.frame-chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.frame-chip.locked{opacity:.55}
.frame-chip .ge-n{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.frame-chip .ge-s{font-size:10.5px;color:var(--muted);font-weight:700}
.frame-chip.on .ge-s{color:var(--accent)}
.frame-row{margin:0 -20px;padding-left:20px;padding-right:20px}
.prof-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.prof-btns{display:flex;flex-direction:column;align-items:flex-start;gap:2px}

/* betaalverzoek */
.pr-amt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg)}
.pr-amt span{font-size:16px;font-weight:700;color:var(--muted)}
.pr-amt input{border:0;background:transparent;padding:12px 0;font:inherit;font-size:16px;flex:1;min-width:0;color:var(--ink)}
.pr-amt input:focus{outline:0}
.pr-qrwrap{min-height:60px}
.pr-qr{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;padding:16px;margin-bottom:8px}
.pr-qr img{width:196px;height:196px;display:block}
.pr-load{color:#8892a8;font-size:14px;font-weight:600}
.pr-sum{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin:0 0 16px}
.payview-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.payview-row span{color:var(--muted);font-weight:600}
.payview-row b{font-weight:700}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
  .sp-check{stroke-dashoffset:0}
}

</header>

    <button data-act="tab" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M9.2 9.5V20M14.8 9.5V20"/></svg>Week</button>
    <button data-act="tab" data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.8 6l1.2 1.2L7.2 5M3.8 12l1.2 1.2 2.2-2.2M3.8 18l1.2 1.2 2.2-2.2"/></svg>Taken</button>
    <button data-act="tab" data-tab="list"><svg viewBox="0 0 24 24"><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2.5l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.1L20 8H6.2"/></svg>Lijst</button>

  </div>
</nav>

<input type="file" id="avatarFile" accept="image/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="timer" hidden></div>
<div id="intro" role="dialog" aria-modal="true" aria-label="Welkom bij Huisweek" hidden></div>
<div id="whatsnew" role="dialog" aria-modal="true" aria-label="Wat is er nieuw" hidden></div>

  <div class="p3-wrap">

  </div>
</div>

<div id="splash" role="presentation">
  <div class="sp-inner">

      <defs>

      </g>
    </svg>
    <div class="sp-title">Huisweek</div>
    <div class="sp-tag">Plan het huishouden, één veeg tegelijk</div>
  </div>
</div>

        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;

            case QRMode.MODE_8BIT_BYTE  : return 8;

            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;

            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;

        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

var index = QRCode;

QRCode.prototype.createDataURL = function(cellSize, margin){
  cellSize = cellSize || 4;
  margin = (margin==null) ? cellSize*2 : margin;
  var n = this.getModuleCount();
  var size = n*cellSize + margin*2;
  var canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle = '#000000';
  for(var r=0;r<n;r++){
    for(var c=0;c<n;c++){
      if(this.isDark(r,c)){
        ctx.fillRect(margin+c*cellSize, margin+r*cellSize, cellSize, cellSize);
      }
    }
  }
  return canvas.toDataURL('image/png');
};

const $=(s,r)=>(r||document).querySelector(s);

const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const wdOf=k=>(fromKey(k).getDay()+6)%7;
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-y0)/86400000+1)/7);
}

function dayState(k){
  const l=S.plan[k]||[];
  if(!l.length)return 'empty';
  return l.every(t=>t.done)?'full':'open';
}
function streak(){
  let n=0,gap=0;
  const today=new Date();
  for(let i=0;i<180;i++){
    const dk=keyOf(addDays(today,-i));
    if(S.shielded&&S.shielded[dk])continue;
    const st=dayState(dk);
    if(st==='full'){
      if(n===0&&i>2)return 0;
      n++;gap=0;
    }else if(st==='open'){
      if(i===0)continue;
      break;
    }else{
      gap++;
      if(gap>2)break;
    }
  }
  return n;
}

function catXp(id){return (S.cstat[id]&&S.cstat[id].xp)||0;}
function ladderOf(id){return LADDERS[id]||GENERIC;}
function rankIdx(xp){let i=0;CAT_STEPS.forEach((v,j)=>{if(xp>=v)i=j;});return i;}
function rankInfo(id){
  const xp=catXp(id),i=rankIdx(xp),lad=ladderOf(id),lo=CAT_STEPS[i],hi=CAT_STEPS[i+1];
  return {xp:xp,i:i,cur:lad[i],nxt:lad[i+1],pct:hi?Math.round((xp-lo)/(hi-lo)*100):100,need:hi?hi-xp:0};
}
function rankCount(minIdx){return Object.keys(S.cstat).filter(id=>rankIdx(S.cstat[id].xp)>=minIdx).length;}
function catAdd(cat,pts,min,sign){
  const c=S.cstat[cat]=S.cstat[cat]||{xp:0,n:0,min:0};
  const before=rankIdx(c.xp);
  c.xp=Math.max(0,c.xp+sign*pts);c.n=Math.max(0,c.n+sign);c.min=Math.max(0,c.min+sign*min);
  const after=rankIdx(c.xp);
  if(sign>0&&after>before){
    for(let i=before+1;i<=after;i++)(S.rankAt[cat]=S.rankAt[cat]||{})[i]=todayKey();
    return after;
  }
  if(sign<0&&after<before){
    for(let i=after+1;i<=before;i++)if(S.rankAt[cat])delete S.rankAt[cat][i];
  }
  return -1;
}

function calcStats(){
  let done=0,early=0,onTime=0,late=0,weekend=0,heavy=0,maxDay=0,timed=0;
  const per={},weeks={},catSet={};
  Object.keys(S.plan).forEach(function(k){
    const wk=keyOf(mondayOf(fromKey(k))),wd=wdOf(k);
    let dc=0;
    (S.plan[k]||[]).forEach(function(t){
      const w=weeks[wk]=weeks[wk]||{n:0,d:0};
      w.n++;
      if(t.at)timed++;
      if(t.done){
        w.d++;done++;dc++;catSet[t.cat]=1;
        if(wd>=5)weekend++;
        if((t.w||defaultW({tid:t.tid,min:t.min}))>=2)heavy++;
        if(t.doneAt){
          const dt=new Date(t.doneAt);
          if(dt.getHours()<9)early++;
          if(dt.getHours()>=21)late++;
          if(t.at){
            const st=fromKey(k);st.setHours(atMin(t)/60|0,atMin(t)%60,0,0);
            if(t.doneAt>=st.getTime()-15*60000&&t.doneAt<=st.getTime()+(t.min+30)*60000)onTime++;
          }
        }
        if(t.who)per[t.who]=(per[t.who]||0)+1;
      }
    });
    if(dc>maxDay)maxDay=dc;
  });
  let perfect=0;
  Object.keys(weeks).forEach(k=>{if(weeks[k].n>=5&&weeks[k].d===weeks[k].n)perfect++;});
  const team=Object.keys(per).filter(id=>per[id]>=3&&personOf(id)).length;
  return {done:done,pts:S.earned,bal:balance(),shopped:S.stats.shopped||0,gear:(S.mascotEquip?Object.values(S.mascotEquip).filter(Boolean).length:0),hasProfile:(S.profileName&&S.profilePhoto)?1:0,early:early,perfect:perfect,team:team,streak:streak(),timers:S.stats.timers||0,rolls:S.stats.rolls||0,bought:S.stats.bought||0,
    onTime:onTime,late:late,weekend:weekend,heavy:heavy,maxDay:maxDay,timed:timed,cats:Object.keys(catSet).length,missions:S.stats.missions||0,maxRanks:rankCount(CAT_STEPS.length-1),rank4:rankCount(3)};
}

/* ---------- confetti ---------- */
function confetti(){
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const cf=CONFETTI.find(x=>x.id===S.confettiId)||CONFETTI[0];
    const c=document.createElement('canvas');c.className='confetti';
    const dpr=Math.min(2,window.devicePixelRatio||1),W=window.innerWidth,H=window.innerHeight;
    c.width=W*dpr;c.height=H*dpr;document.body.appendChild(c);
    const x=c.getContext('2d');x.scale(dpr,dpr);
    const cols=cf.cols||['#4C66FF','#1FA267','#F5A524','#E5484D','#A855F7','#06B6D4'];
    const ps=[];
    for(let i=0;i<(cf.emojis?70:120);i++){
      ps.push({x:W/2+(Math.random()-.5)*90,y:H*.55,vx:(Math.random()-.5)*12,vy:-(6+Math.random()*11),g:.3+Math.random()*.12,s:5+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],e:cf.emojis?cf.emojis[i%cf.emojis.length]:null});
    }
    const t0=performance.now();
    (function f(t){
      const el=t-t0;
      x.clearRect(0,0,W,H);
      ps.forEach(function(p){
        p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.r+=p.vr;
        x.save();x.translate(p.x,p.y);x.rotate(p.e?p.r*.3:p.r);x.globalAlpha=Math.max(0,1-el/2300);
        if(p.e){x.font=Math.round(p.s*2.6)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(p.e,0,0);}
        else{x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);}
        x.restore();
      });
      if(el<2300)requestAnimationFrame(f);else c.remove();
    })(t0);
  }catch(e){}
}

function ensureWeek(){
  let changed=false;
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i));
    S.repeats.forEach(function(r){
      if(r.wd!==i||k<r.start)return;
      if((r.skip||[]).indexOf(k)>=0)return;
      const arr=(S.plan[k]=S.plan[k]||[]);
      if(arr.some(x=>x.rid===r.id))return;
      arr.push({id:uid(),rid:r.id,tid:r.tid,name:r.name,emoji:r.emoji,cat:r.cat,min:r.min,w:r.w||null,at:r.at||null,time:r.time||'any',who:r.who||null,note:r.note||'',done:false});
      changed=true;
    });
  }
  if(changed)save();
}
function dropRule(rid,fromKey){
  S.repeats=S.repeats.filter(r=>r.id!==rid);
  Object.keys(S.plan).forEach(function(k){
    S.plan[k]=(S.plan[k]||[]).filter(function(t){
      if(t.rid!==rid)return true;
      if(!t.done&&k>=fromKey)return false;
      delete t.rid;return true;
    });
  });
}

/* ---------- vegen ---------- */
function attachSwipe(row,opts){
  const card=row.querySelector('.card');
  const TH=84;
  let sx=0,sy=0,dx=0,id=null,state=0;
  row.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('button'))return;
    state=1;sx=e.clientX;sy=e.clientY;dx=0;id=e.pointerId;
  });
  row.addEventListener('pointermove',function(e){
    if(state===0||e.pointerId!==id)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(state===1){
      if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.3){
        state=2;try{row.setPointerCapture(id);}catch(_){}
        row.classList.add('dragging');
      }else if(Math.abs(my)>10){state=0;return;}
      else return;
    }
    dx=mx;
    const can=dx>0?!!opts.right:!!opts.left;
    card.style.transform='translateX('+(can?dx:dx*0.18)+'px)';
    row.dataset.dir=can?(dx>0?'r':'l'):'';
    row.classList.toggle('armed',can&&Math.abs(dx)>TH);
  });
  function end(cancelled){
    if(state!==2){state=0;return;}
    state=0;
    row._dragEnd=Date.now();
    row.classList.remove('dragging','armed');
    const fn=dx>0?opts.right:opts.left;
    const fire=!cancelled&&fn&&Math.abs(dx)>TH;
    if(fire&&dx<0){
      card.style.transform='translateX(-105%)';
      setTimeout(fn,170);
    }else{
      card.style.transform='';

function toggleDone(key,id){
  const arr=S.plan[key]||[];
  const t=arr.find(x=>x.id===id);
  if(!t)return;
  const wasFull=arr.length>0&&arr.every(x=>x.done);
  t.done=!t.done;
  let rankUp=-1;
  if(t.done){
    t.pts=pointsOf(t)*(boostActive()?2:1);t.doneAt=Date.now();S.earned+=t.pts;
    rankUp=catAdd(t.cat,t.pts,t.min,1);
  }else{
    const back=t.pts!=null?t.pts:pointsOf(t);
    S.earned=Math.max(0,S.earned-back);if(S.spent>S.earned)S.spent=S.earned;
    catAdd(t.cat,back,t.min,-1);
    delete t.pts;delete t.doneAt;
  }
  const nowFull=arr.every(x=>x.done);
  if(t.done)S.pop=t.id;
  save();renderAll();S.pop=null;
  if(t.done){
    const chk=$('.check.pop');if(chk)floatPoints(chk,'+'+t.pts+' ⭐'+(boostActive()?' ⚡':''));
    haptic(14);
    if(nowFull&&!wasFull){
      confetti();haptic([20,40,20]);
      toast('Dag afgerond! 🎉 '+ptsOf(arr)+' punten');
    }else{
      toast(TASK_LINES[Math.floor(Math.random()*TASK_LINES.length)]);
    }
  }
  if(rankUp>=0){
    const cc=catOf(t.cat),rr=ladderOf(t.cat)[rankUp];
    qToast('🎓 Nieuwe rang in '+cc.name+': '+rr[1]+' '+rr[0],function(){confetti();haptic([30,50,30]);});
  }
  checkBadges();
}

function agendaHtml(list){
  const timed=list.filter(t=>t.at),free=list.filter(t=>!t.at);
  let html='';
  if(free.length)html+='<h3 class="tgrp">Zonder vaste tijd</h3><div class="list">'+free.map(t=>planRow(t,S.sel,true)).join('')+'</div>';
  html+='<h3 class="tgrp">🗓️ Agenda</h3>';
  if(!timed.length)html+='<p class="tip" style="margin:0 0 10px">Nog geen taken met een vaste tijd. Tik op een taak en kies een tijd, of tik hieronder op een uur.</p>';
  let s0=6,e0=22;
  timed.forEach(t=>{const a=atMin(t);s0=Math.min(s0,Math.floor(a/60));e0=Math.max(e0,Math.ceil((a+t.min)/60));});
  const isToday=S.sel===todayKey();
  if(isToday){const nh=Math.floor(nowMin()/60);s0=Math.min(s0,nh);e0=Math.max(e0,Math.min(24,nh+1));}
  e0=Math.min(24,Math.max(e0,s0+4));
  const H=(e0-s0)*PX;
  const ev=timed.map(t=>({t:t,s:atMin(t),e:atMin(t)+Math.max(t.min,40)})).sort((a,b)=>a.s-b.s);
  let cluster=[],clusterEnd=0;const laneEnd=[];
  function flush(){const n=cluster.reduce((m,x)=>Math.max(m,x.lane+1),1);cluster.forEach(x=>{x.n=n;});cluster=[];}
  ev.forEach(function(x){
    if(cluster.length&&x.s>=clusterEnd){flush();laneEnd.length=0;clusterEnd=0;}
    let l=laneEnd.findIndex(en=>en<=x.s);
    if(l<0){l=laneEnd.length;laneEnd.push(0);}
    laneEnd[l]=x.e;x.lane=l;cluster.push(x);clusterEnd=Math.max(clusterEnd,x.e);
  });
  flush();
  let hours='';
  for(let h=s0;h<=e0;h++)hours+='<div class="ag-h" style="top:'+((h-s0)*PX)+'px"><span>'+pad(h%24)+':00</span></div>';
  const evs=ev.map(function(x){

/* agenda-bestand (.ics) voor de agenda van je telefoon */
function icsEsc(x){return String(x).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsDate(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';}
function icsText(){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Huisweek//NL','CALSCALE:GREGORIAN','X-WR-CALNAME:Huisweek'];
  let n=0;
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i));
    (S.plan[k]||[]).forEach(function(t){
      if(!t.at)return;
      n++;
      const st=fromKey(k);st.setHours(Math.floor(atMin(t)/60),atMin(t)%60,0,0);
      const en=new Date(st.getTime()+t.min*60000);
      const p=personOf(t.who);
      L.push('BEGIN:VEVENT','UID:'+t.id+'-'+k+'@huisweek','DTSTAMP:'+stamp,'DTSTART:'+icsDate(st),'DTEND:'+icsDate(en),
        'SUMMARY:'+icsEsc(t.emoji+' '+t.name),
        'DESCRIPTION:'+icsEsc('Huisweek, '+fmtMin(t.min)+', '+pointsOf(t)+' punten'+(p?', '+p.name:'')),
        'BEGIN:VALARM','TRIGGER:-PT'+(S.remind.lead||10)+'M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(t.name),'END:VALARM','END:VEVENT');
    });
  }
  L.push('END:VCALENDAR');
  return n?L.join('\r\n'):'';
}
async function exportICS(){
  const text=icsText();
  if(!text){toast('Geen taken met een vaste tijd deze week.');return;}
  const name='huisweek-'+keyOf(S.weekStart)+'.ics';
  try{
    const file=new File([text],name,{type:'text/calendar'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Huisweek'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  try{
    const blob=new Blob([text],{type:'text/calendar'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('Agendabestand gemaakt. Open het om de taken toe te voegen.');
  }catch(e){TX=text;openSheetWith(renderTextSheet);}
}

/* ---------- timer ---------- */
let TM=null;
function beep(){
  try{
    const a=TM&&TM.ac;
    if(!a)return;
    if(a.resume)a.resume();
    [0,.28,.56].forEach(function(d){
      const o=a.createOscillator(),g=a.createGain();
      o.frequency.value=880;g.gain.value=.16;
      o.connect(g);g.connect(a.destination);
      o.start(a.currentTime+d);o.stop(a.currentTime+d+.16);
    });
  }catch(e){}
}
function startTimer(key,id,minutes){
  const it=(S.plan[key]||[]).find(x=>x.id===id);
  if(!it)return;
  stopTimer();
  let ac=null;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){ac=new AC();if(ac.resume)ac.resume();}}catch(e){}
  const total=Math.max(1,minutes||it.min)*60;
  TM={key:key,id:id,name:it.name,emoji:it.emoji,total:total,end:Date.now()+total*1000,paused:false,left:total,over:false,ac:ac,lock:null,iv:null};
  try{
    if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){if(TM)TM.lock=l;else l.release();}).catch(function(){});
  }catch(e){}
  renderTimer();
  $('#timer').hidden=false;
  TM.iv=setInterval(tickTimer,250);
}
function stopTimer(){
  if(!TM)return;
  clearInterval(TM.iv);
  try{if(TM.lock)TM.lock.release();}catch(e){}
  try{if(TM.ac&&TM.ac.close)TM.ac.close();}catch(e){}
  TM=null;
  const t=$('#timer');t.hidden=true;t.innerHTML='';
}
function tickTimer(){
  if(!TM||TM.paused)return;
  TM.left=Math.max(0,Math.ceil((TM.end-Date.now())/1000));
  paintTimer();
  if(TM.left===0&&!TM.over){
    TM.over=true;beep();haptic([200,100,200]);renderTimer();
  }
}
function paintTimer(){
  if(!TM)return;
  const m=Math.floor(TM.left/60),s=TM.left%60;
  const t=$('#tm-time'),r=$('#tm-ring');
  if(t)t.textContent=pad(m)+':'+pad(s);
  if(r)r.style.setProperty('--p',Math.round((1-TM.left/TM.total)*100));
}
function renderTimer(){
  if(!TM)return;
  const el=$('#timer');
  el.className=TM.over?'tm-over':'';
  el.innerHTML='<div class="tm-wrap"><div class="tm-top"><button class="linkbtn" type="button" data-act="timerstop">Stop</button></div>'
    +'<div class="tm-body"><div class="tm-emoji">'+esc(TM.emoji)+'</div><h2>'+esc(TM.name)+'</h2>'
    +'<div class="tm-ring" id="tm-ring"><div class="tm-in"><b id="tm-time">00:00</b><span>'+(TM.over?'Tijd is om!':(TM.paused?'gepauzeerd':'bezig'))+'</span></div></div></div>'
    +'<div class="tm-actions">'
    +(TM.over?'<button class="btn" type="button" data-act="timermore">+ 5 min</button>':'<button class="btn" type="button" data-act="timerpause">'+(TM.paused?'Hervat':'Pauze')+'</button>')
    +'<button class="btn primary" type="button" data-act="timerdone">Klaar ✅</button></div></div>';
  paintTimer();
}

/* ---------- toast ---------- */
let toastTimer,toastFree=0;
function qToast(msg,onShow){
  const start=Math.max(Date.now()+400,toastFree);
  toastFree=start+3000;
  setTimeout(function(){toast(msg);if(onShow)onShow();},start-Date.now());
}
function toast(msg,label,fn,ms){
  toastFree=Math.max(toastFree,Date.now()+3000);
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button type="button">'+esc(label)+'</button>':'');
  if(label)t.querySelector('button').onclick=function(){fn();t.classList.remove('show');};
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},ms||5000);
}

function renderWeek(){
  const main=$('#main');

    const d=addDays(S.weekStart,i),k=keyOf(d);
